        *{
    margin:0;
    padding:0;
    box-sizing:border-box;
}
body{
    font-family: 'Outfit';
    background:linear-gradient(#ffdad5,#ffdad5);
}
.contact-container{
    height:100vh;
    display:flex;
    align-items: center;
    justify-content: space-evenly;
}
.contact-left{
    display:flex;
    flex-direction:column;
    align-items:start;
    gap:20px;
}
.contact-left-title h2{
    font-weight:600px;
    color:#a363aa;
    font-size:40px;
    margin-bottom:25px;
}
.contact-left-title hr{
    border:none;
    width:120px;
    height:5px;
    background-color:#a363aa;
    border-radius:10px;
    margin-bottom:20px;
}
.inputs-contacts{
    width:400px;
    height:50px;
    border:none;
    outline:none;
    padding-left:25px;
    font-weight:500;
    color:#666;
    border-radius:50px;
}
.contact-left textarea{
    height:140px;
    padding-top:15px;
    border-radius:20px;
}
.inputs-contacts:focus{
    border:1px solid #ff994f;
}
.inputs-contacts::placeholder{
color:#a9a9a9;
}
.contact-left button{
    display:flex;
    align-items:center;
    padding:15px 30px;
    border-radius:50px;
    border:none;
    font-size: 16px;
    color:#fff;
    gap:10px;
    cursor:pointer;
    background: linear-gradient(270deg,#ff994f,#fa6d86);
}
.contact-left button img{
    height:15px;
}
.contact-right img{
        width:500px;
}
@media(max-width:900px){
    .inputs-contacts{
        width:80vw;
    }
    .contact-right{
        display:none;
}
}

    </style>
